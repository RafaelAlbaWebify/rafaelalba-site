name: Validate website alignment preview

on:
  push:
    branches:
      - align-professional-positioning-20260927

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve static export and capture preview
        run: |
          python3 -m http.server 4173 --directory out > /tmp/rafaelalba-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          sleep 2
          mkdir -p alignment-preview
          cat > capture-preview.mjs <<'EOF'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });

          async function capture(viewport, prefix) {
            const page = await browser.newPage({ viewport });
            await page.goto("http://127.0.0.1:4173/", { waitUntil: "networkidle", timeout: 120000 });
            await page.waitForTimeout(2400);

            const sections = ["hero", "services", "projects", "how-i-work", "experience", "certifications", "contact"];
            for (const id of sections) {
              const locator = page.locator(`#${id}`);
              if (await locator.count()) {
                await locator.scrollIntoViewIfNeeded();
                await page.waitForTimeout(900);
                await locator.screenshot({ path: `alignment-preview/${prefix}-${id}.png` });
              }
            }

            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(600);
            await page.screenshot({ path: `alignment-preview/${prefix}-full.png`, fullPage: true });
          }

          await capture({ width: 1440, height: 1000 }, "desktop");
          await capture({ width: 390, height: 844 }, "mobile");

          await browser.close();
          EOF
          node capture-preview.mjs

      - name: Upload preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: rafaelalba-alignment-preview
          path: alignment-preview/
          if-no-files-found: error
          retention-days: 7
