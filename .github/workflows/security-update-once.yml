name: Apply compatible security updates to QA branch

on:
  push:
    branches: [qa-security-contact-accessibility-2026-11]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa-security-contact-accessibility-2026-11
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove unused server-only/template packages
        run: npm uninstall next-auth prisma @prisma/client @mdxeditor/editor sharp
      - name: Patch Next.js and compatible dependency advisories
        run: |
          npm install 'next@^16.4.5'
          npm audit fix || true
      - name: Verify static production build
        run: npm run build -- --webpack
      - name: Commit reviewed dependency updates to QA branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply compatible security updates and prune unused packages'
            git push origin HEAD:qa-security-contact-accessibility-2026-11
          fi
